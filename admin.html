<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>VOYAGE — פניות</title>
<style>
  @font-face { font-family: 'Dorian'; src: url("assets/fonts/Dorian.ttf") format('truetype'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Artzisraeli'; src: url("assets/fonts/Artzisraeli.ttf") format('truetype'); font-weight: 400; font-display: swap; }

  :root{
    --cream:#F3EFE8; --cream-2:#EAE4D9; --ink:#3F3B32; --ink-2:#4A4639;
    --body:#5A5548; --muted:#8A8375; --olive:#7E7657; --line:#C9C0AE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Artzisraeli','Assistant',sans-serif;min-height:100vh;}
  h1{font-family:'Dorian',serif;font-weight:400;}

  /* Password gate */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  #gate .box{background:#fff;border-radius:18px;padding:40px 36px;max-width:360px;width:100%;box-shadow:0 20px 50px -20px rgba(63,59,50,.25);text-align:center;}
  #gate h1{font-size:26px;margin:0 0 20px;}
  #gate input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--line);font-size:16px;text-align:center;margin-bottom:14px;}
  #gate button{width:100%;padding:14px;border:none;border-radius:10px;background:var(--ink);color:var(--cream);font-size:16px;cursor:pointer;}
  #gate button:hover{background:var(--olive);}
  #gate .err{color:#B4453A;font-size:14px;margin-top:12px;min-height:18px;}

  /* Dashboard */
  #dash{display:none;max-width:1100px;margin:0 auto;padding:32px 20px 60px;}
  #dash header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;}
  #dash h1{font-size:28px;margin:0;}
  #dash .meta{color:var(--muted);font-size:14px;}
  #dash .actions{display:flex;gap:10px;}
  #dash button{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;}
  #dash button:hover{background:var(--cream-2);}

  .table-wrap{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 2px 14px -6px rgba(63,59,50,.15);}
  table{width:100%;border-collapse:collapse;min-width:820px;}
  th,td{padding:14px 16px;text-align:right;font-size:14.5px;border-bottom:1px solid var(--cream-2);vertical-align:top;}
  th{color:var(--muted);font-weight:500;font-size:13px;letter-spacing:.03em;white-space:nowrap;}
  td.type{white-space:nowrap;}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;}
  .badge.registration{background:#EAE4D9;color:var(--ink);}
  .badge.gift{background:#E4EEE6;color:#3E6B4F;}
  .empty,.loading,.error{text-align:center;padding:60px 20px;color:var(--muted);}
  .error{color:#B4453A;}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>אזור מנהל</h1>
    <input type="password" id="pw" placeholder="סיסמה" autocomplete="off">
    <button id="pw-submit">כניסה</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>

<div id="dash">
  <header>
    <div>
      <h1>פניות מהאתר</h1>
      <div class="meta" id="count-meta"></div>
    </div>
    <div class="actions">
      <button id="refresh-btn">רענון</button>
      <button id="logout-btn">יציאה</button>
    </div>
  </header>
  <div class="table-wrap">
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>תאריך</th>
          <th>סוג</th>
          <th>שם</th>
          <th>טלפון</th>
          <th>אימייל</th>
          <th>חדר</th>
          <th>הודעה</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="loading" id="state-loading" style="display:none">טוען פניות…</div>
    <div class="empty" id="state-empty" style="display:none">אין עדיין פניות.</div>
    <div class="error" id="state-error" style="display:none">שגיאה בטעינת הפניות.</div>
  </div>
</div>

<script>
const ADMIN_URL = 'https://zwxuzprtjfpjxzkjunyz.supabase.co/functions/v1/admin-submissions';
let currentPassword = '';

const gate = document.getElementById('gate');
const dash = document.getElementById('dash');
const pwInput = document.getElementById('pw');
const pwErr = document.getElementById('pw-err');

const TYPE_LABELS = { registration: 'הרשמה', gift: 'מדיטציה' };

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('he-IL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadSubmissions(password) {
  const table = document.getElementById('table');
  const loading = document.getElementById('state-loading');
  const empty = document.getElementById('state-empty');
  const errEl = document.getElementById('state-error');
  const rows = document.getElementById('rows');

  table.style.display = 'none';
  empty.style.display = 'none';
  errEl.style.display = 'none';
  loading.style.display = 'block';

  try {
    const res = await fetch(ADMIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });

    if (res.status === 401) {
      return { unauthorized: true };
    }
    if (!res.ok) throw new Error('bad status');

    const data = await res.json();
    const submissions = data.submissions || [];

    loading.style.display = 'none';
    document.getElementById('count-meta').textContent = submissions.length + ' פניות';

    if (submissions.length === 0) {
      empty.style.display = 'block';
      return { ok: true };
    }

    rows.innerHTML = submissions.map(s => `
      <tr>
        <td>${fmtDate(s.created_at)}</td>
        <td class="type"><span class="badge ${s.type}">${TYPE_LABELS[s.type] || s.type}</span></td>
        <td>${s.name || ''}</td>
        <td dir="ltr" style="text-align:right">${s.phone || ''}</td>
        <td dir="ltr" style="text-align:right">${s.email || ''}</td>
        <td>${s.room || ''}</td>
        <td>${s.message || ''}</td>
      </tr>
    `).join('');
    table.style.display = 'table';
    return { ok: true };
  } catch (err) {
    loading.style.display = 'none';
    errEl.style.display = 'block';
    return { ok: false };
  }
}

async function tryLogin() {
  const password = pwInput.value;
  if (!password) return;
  pwErr.textContent = '';
  const submitBtn = document.getElementById('pw-submit');
  submitBtn.disabled = true;

  const result = await loadSubmissions(password);

  submitBtn.disabled = false;
  if (result.unauthorized) {
    pwErr.textContent = 'סיסמה שגויה';
    return;
  }
  if (result.ok === false) {
    pwErr.textContent = 'שגיאת תקשורת, נסו שוב';
    return;
  }

  currentPassword = password;
  gate.style.display = 'none';
  dash.style.display = 'block';
}

document.getElementById('pw-submit').addEventListener('click', tryLogin);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

document.getElementById('refresh-btn').addEventListener('click', () => {
  if (currentPassword) loadSubmissions(currentPassword);
});

document.getElementById('logout-btn').addEventListener('click', () => {
  currentPassword = '';
  pwInput.value = '';
  dash.style.display = 'none';
  gate.style.display = 'flex';
});
</script>

</body>
</html>
